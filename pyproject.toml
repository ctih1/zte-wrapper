[project]
name = "zte-wrapper"
version = "1.0.6"
authors = [
  { name="ctih1", email="contact@ctih1.fi" },
]
description = "A wrapper that lets you interact with the new ZTE WebUI"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
  "aiohttp"
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/ctih1/zte-wrapper"
Issues = "https://github.com/ctih1/zte-wrapper/issues"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
  ".vscode",
  "notes",
  "screenshots"
]